name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Enter...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build or commit
  - type: dropdown
    id: input
    attributes:
      label: Input device
      options:
        - Keyboard and mouse
        - Gamepad
        - Both
        - Not applicable
  - type: textarea
    id: evidence
    attributes:
      label: Logs or media
