name: Feature or task
description: Propose scoped work for the vertical slice
title: "[Task]: "
labels: ["planning"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State the player or production outcome, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Observable condition\n- [ ] Testable condition"
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Proposed milestone
      options: [M0, M1, M2, M3, M4, M5]
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2]
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
